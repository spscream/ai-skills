name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Unused imports and undefined names only. A broken call site inside a
      # function is invisible to an import-time check, which is why the suite
      # also runs main() -- see tests/test_collector_main.py.
      - name: Lint Python
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check --select E9,F63,F7,F82,F401 .

      - name: Lint shell
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck skills/consensus/scripts/consensus.sh
